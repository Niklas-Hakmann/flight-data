services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flightwatch
      POSTGRES_PASSWORD: flightwatch
      POSTGRES_DB: flightwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      ConnectionStrings__FlightWatch: "Host=postgres;Database=flightwatch;Username=flightwatch;Password=flightwatch"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
